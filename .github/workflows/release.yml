name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A tag is immutable; never cancel an in-flight release run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "tag version: ${TAG_VERSION}, workspace version: ${WORKSPACE_VERSION}"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${WORKSPACE_VERSION} in Cargo.toml"
            echo "Bump the workspace version (and the whale-* entries under [workspace.dependencies]) before tagging."
            exit 1
          fi

  test:
    name: test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
      - name: Run workspace tests
        run: cargo test --workspace --all-features

  release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          # Tags such as v0.2.0-beta.1 are marked as pre-releases.
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG

  publish-crates:
    name: Publish to crates.io
    needs: [test, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Publish crates in topological dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          # 检查是否配置了 crates.io Token
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CRATES_IO_TOKEN secret is not set. Please configure it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 按照依赖拓扑顺序依次发布：
          # whale-protocol -> whale-store -> whale-adapters -> whale-core -> whale-daemon -> whale-sdk-rust
          CRATES=(
            "crates/whale-protocol"
            "crates/whale-store"
            "crates/whale-adapters"
            "crates/whale-core"
            "crates/whale-daemon"
            "crates/whale-sdk-rust"
          )

          for crate in "${CRATES[@]}"; do
            crate_name=$(basename "$crate")
            echo "================================================="
            echo "Checking & Publishing ${crate_name} to crates.io..."
            echo "================================================="

            # 抓取发布日志，并做幂等判断
            publish_log=$(mktemp)
            if cargo publish -p "$crate_name" 2>&1 | tee "$publish_log"; then
              echo "Successfully published ${crate_name}!"
            else
              # 如果错误信息提示该版本已经存在，视为成功并继续
              if grep -qi "already exists" "$publish_log"; then
                echo "Notice: ${crate_name} version already exists on crates.io, skipping."
              else
                echo "::error::Failed to publish ${crate_name}"
                rm -f "$publish_log"
                exit 1
              fi
            fi
            rm -f "$publish_log"

            # crates.io 索引同步存在短暂延迟，等待 30 秒以确保下游依赖解析成功
            if [ "$crate" != "crates/whale-sdk-rust" ]; then
              echo "Waiting 30 seconds for crates.io index propagation..."
              sleep 30
            fi
          done

          echo "All crates published successfully!"
