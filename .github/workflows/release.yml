name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A tag is immutable; never cancel an in-flight release run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "tag version: ${TAG_VERSION}, workspace version: ${WORKSPACE_VERSION}"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${WORKSPACE_VERSION} in Cargo.toml"
            echo "Bump the workspace version (and the whale-* entries under [workspace.dependencies]) before tagging."
            exit 1
          fi

  test:
    name: test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
      - name: Run workspace tests
        run: cargo test --workspace --all-features

  release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          # Tags such as v0.2.0-beta.1 are marked as pre-releases.
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG
