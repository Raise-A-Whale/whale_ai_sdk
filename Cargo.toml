[workspace]
resolver = "2"
members = [
    "crates/whale-protocol",
    "crates/whale-adapters",
    "crates/whale-core",
    "crates/whale-daemon",
    "crates/whale-sdk-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Whale AI SDK Authors"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal workspace crates
whale-protocol = { path = "crates/whale-protocol" }
whale-adapters = { path = "crates/whale-adapters" }
whale-core = { path = "crates/whale-core" }
whale-daemon = { path = "crates/whale-daemon" }
whale-sdk-rust = { path = "crates/whale-sdk-rust" }
