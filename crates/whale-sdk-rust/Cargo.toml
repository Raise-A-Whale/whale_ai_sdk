[package]
name = "whale-sdk-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust application SDK for owning Whale Agent runtimes, Sessions, and Runs"
readme = "README.md"

[dependencies]
whale-protocol = { workspace = true }
whale-core = { workspace = true }
whale-daemon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
dashmap = "6"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
whale-adapters = { workspace = true }
whale-store = { workspace = true }
async-stream = "0.3.6"
